<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f5f4f0;--ink:#1c1b19;--ink-2:#4a4944;--muted:#6f6e69;--rule:#e2e0da;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--max:1140px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(32px,4vw,48px);line-height:1.08}
h2{font-size:clamp(24px,2.6vw,32px);line-height:1.15}
h3{font-size:22px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}

header.top{border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
header.top .brand{display:flex;align-items:center;text-decoration:none}
header.top .brand img{height:38px;width:auto;display:block}
header.top nav{display:flex;gap:22px;font-size:14px}
header.top nav a{text-decoration:none;color:var(--ink-2)}
header.top nav a:hover{color:var(--ink)}
header.top nav .nd{position:relative}
header.top nav .ndt{background:none;border:0;padding:0;font:inherit;color:var(--ink-2);display:flex;align-items:center;gap:5px}
header.top nav .ndt::after{content:'';width:0;height:0;border:3.5px solid transparent;border-top-color:currentColor;margin-top:3px}
header.top nav .ndt:hover,header.top nav .ndt.on,header.top nav .nd.open .ndt{color:var(--ink)}
header.top nav .nd>.menu{position:absolute;left:-11px;top:100%;padding-top:11px;display:none;z-index:30}
header.top nav .nd.open>.menu{display:block}
header.top nav .nd>.menu ul{list-style:none;margin:0;padding:6px;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 22px rgba(28,27,25,.10)}
header.top nav .nd>.menu a{display:block;padding:7px 11px;border-radius:5px;color:var(--ink-2);white-space:nowrap;border-bottom:0}
header.top nav .nd>.menu a:hover,header.top nav .nd>.menu a:focus-visible{background:var(--surface);color:var(--ink)}
header.top nav .nd>.menu a.on{color:var(--ink);font-weight:600;border-bottom:0;padding-bottom:7px}

/* hero */
.hero{padding:56px 0 44px;display:grid;grid-template-columns:5fr 6fr;gap:48px;align-items:center}
.hero .lede{font-size:18px;color:var(--ink-2);max-width:34em;margin-top:18px}
.stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:32px;line-height:1}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}

/* landscape figure */
.landscape svg{width:100%;height:auto;display:block}
.landscape a{text-decoration:none}
.landscape a:hover rect{fill-opacity:.2}
.hint{font-size:13px;color:var(--muted);margin-top:14px}

section{padding:52px 0;border-top:1px solid var(--rule)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.section-head p{max-width:46em;color:var(--ink-2)}

/* area strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.strip a{text-decoration:none;border-top:3px solid var(--c);padding:12px 2px 0;display:block}
.strip a b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.strip a span{display:block;font-size:13px;color:var(--muted);margin-top:4px}

/* areas */
.area-block{padding:44px 0;border-top:1px solid var(--rule);scroll-margin-top:24px}
.area-block .grid{display:grid;grid-template-columns:5fr 7fr;gap:40px}
.lead{border-left:4px solid var(--c);padding-left:20px}
.lead .count{font-size:13px;color:var(--muted);margin-top:8px}
.lead .def{margin-top:12px;color:var(--ink-2);font-size:17px}
.lead .tags-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:22px}
.lead .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lead .tags span{font-size:12.5px;color:var(--ink-2);background:var(--surface);border-radius:999px;padding:4px 10px}
.lead .goto{display:inline-block;margin-top:18px;font-size:14px;color:var(--c);text-decoration:none;border-bottom:1px solid transparent}
.lead .goto:hover{border-bottom-color:var(--c)}
.qs{margin:0 0 22px;padding-left:20px;color:var(--ink-2)}
.qs li{margin-bottom:6px}
.qs li::marker{color:var(--c)}
.reps-h{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 8px}
.reps{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.reps li{display:grid;grid-template-columns:108px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.reps .v{font-size:12.5px;color:var(--ink);font-weight:600;padding-top:3px}
.reps .v small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:2px}
.reps .t{line-height:1.4}
.reps .t a{text-decoration:none;border-bottom:1px solid var(--rule)}
.reps .t a:hover{border-bottom-color:var(--ink)}
.reps .a{font-size:13px;color:var(--muted);margin-top:2px}

/* AI4Sci pipeline */
.pipe{margin-top:34px;padding-top:26px;border-top:1px dashed var(--rule)}
.pipe h4{font-size:20px}
.pipe>p{color:var(--muted);font-size:14px;margin:4px 0 18px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.stage{padding:16px 18px;border-left:1px solid var(--rule);position:relative;background:#fff}
.stage:first-child{border-left:0}
.topics{grid-template-columns:repeat(5,1fr)}
.topics .stage::after{display:none}
.topics .stage{padding:14px 14px}
.topics .stage .sname{font-size:14px}
.stage:not(:last-child)::after{content:'';position:absolute;right:-7px;top:22px;width:12px;height:12px;border-top:1px solid var(--rule);border-right:1px solid var(--rule);transform:rotate(45deg);background:#fff;z-index:1}
.stage .sname{font-weight:600;font-size:15px;color:var(--c)}
.stage .sq{font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.4}
.stage ul{list-style:none;margin:0;padding:0;font-size:13.5px}
.stage li{padding:4px 0;border-top:1px solid var(--rule);line-height:1.35}
.stage li a{text-decoration:none;border-bottom:1px solid var(--rule)}
.stage li a:hover{border-bottom-color:var(--ink)}

/* convergence */
.conv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.conv .cell{border:1px solid var(--rule);border-radius:8px;padding:18px 20px}
.conv .pair{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.conv .pair .sw{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.conv h4{font-size:19px}
.conv p{color:var(--ink-2);font-size:15.5px;line-height:1.5;margin:8px 0 16px}
.conv .sel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.conv ul{list-style:none;margin:0;padding:0;font-size:13px}
.conv li{padding:5px 0;border-top:1px solid var(--rule);line-height:1.35}
.conv li:first-child{border-top:0}
.conv li a{color:var(--ink-2)}
.conv li a{text-decoration:none;border-bottom:1px solid var(--rule)}
.conv li a:hover{border-bottom-color:var(--ink)}

/* applications */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.apps .cell{background:var(--surface);border-radius:8px;padding:16px 18px}
.apps h4{font-size:17px;margin-bottom:8px}
.apps ul{list-style:none;margin:0;padding:0;font-size:13.5px}
.apps li{padding:4px 0;line-height:1.35}
.apps li a{text-decoration:none;border-bottom:1px solid #d9d6ce}
.apps li a:hover{border-bottom-color:var(--ink)}
.apps li span{color:var(--muted)}

/* trend (appendix) */
.trend{display:grid;grid-template-columns:1fr 200px;gap:28px;align-items:start}
.trend svg{width:100%;height:auto;display:block}
.trend .axis text{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.trend .axis line,.trend .axis path{stroke:var(--rule)}
.legend{font-size:14px;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.legend button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;margin:-4px -6px;text-align:left;border-radius:4px;color:var(--ink-2)}
.legend button:hover,.legend button:focus-visible{background:var(--surface);outline:none}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.trend .bar{transition:opacity .15s}
.trend .bar.dim{opacity:.25}

/* badges + list */
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surface);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.badge.ws{background:#fff;border:1px solid var(--rule);font-weight:500}
.badge.pre{background:#fff;border:1px dashed var(--rule);font-weight:500}
.badge.note{background:transparent;color:var(--muted);font-weight:500;padding-left:0}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.controls input,.controls select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
.controls input{min-width:260px;flex:1}
.controls input:focus,.controls select:focus{outline:2px solid var(--ink);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips[hidden]{display:none}
.chips.sub{margin-top:8px;padding-left:14px;border-left:2px solid var(--rule)}
.chips.sub .chip{font-size:12.5px;padding:4px 10px}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.count-line{font-size:14px;color:var(--muted);margin:14px 0 10px}
.paperlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.paperlist li{display:grid;grid-template-columns:1fr auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.paperlist li.yh{display:block;padding:34px 0 8px;border-bottom:1px solid var(--ink)}
.paperlist li.yh:first-child{padding-top:8px}
.paperlist li.yh h3{font-size:26px}
.paperlist .yr{font-size:14px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.paperlist .ttl{font-size:15.5px;line-height:1.4}
.paperlist .ttl a{text-decoration:none}
.paperlist .ttl a:hover{text-decoration:underline}
.paperlist .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paperlist .also{color:var(--muted);font-style:italic}
.paperlist .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;vertical-align:middle}
.paperlist .links{font-size:13px;padding-top:3px;text-align:right;max-width:220px}
.paperlist .links a{color:var(--ink-2);text-decoration:none;margin-left:10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.paperlist .links a:hover{border-bottom-color:var(--ink)}
.empty{padding:28px 0;color:var(--muted)}
footer{padding:36px 0 56px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule)}
.err{background:var(--surface);padding:24px;border-radius:8px;margin:40px 0;color:var(--ink-2)}

@media (max-width:860px){
  header.top .wrap{height:auto;padding:10px 20px;gap:10px 12px;flex-wrap:wrap}
  header.top .brand img{height:30px}
  header.top nav{gap:9px 14px;font-size:13px;flex-wrap:wrap}
  .wrap{padding:0 20px}
  .hero{grid-template-columns:1fr;gap:32px;padding-top:36px}
  .strip{grid-template-columns:1fr 1fr}
  .area-block .grid{grid-template-columns:1fr;gap:24px}
  .stages,.topics{grid-template-columns:1fr}
  .stage{border-left:0;border-top:1px solid var(--rule)}
  .stage:first-child{border-top:0}
  .stage:not(:last-child)::after{display:none}
  .conv{grid-template-columns:1fr}
  .apps{grid-template-columns:1fr 1fr}
  .trend{grid-template-columns:1fr}
  .legend{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
  .paperlist li{grid-template-columns:1fr}
    .paperlist .links{padding-top:0}
  .paperlist .links a:first-child{margin-left:0}
  .reps li{grid-template-columns:1fr;gap:4px}
}


.phead{padding:56px 0 8px}
.phead a.back{display:inline-block;font-size:14px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);margin-bottom:18px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:28px 24px;padding:24px 0 48px}
.gal figure{margin:0}
.gal img{width:100%;border-radius:8px;display:block;background:var(--surface)}
.gal figcaption{margin-bottom:8px;font-size:14.5px;color:var(--ink-2)}
@media (max-width:860px){.gal{grid-template-columns:1fr}}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><img src="/images/logopic/dsail_logo2.png" alt="DSAIL — Data Science &amp; Artificial Intelligence Lab, KAIST"></a>
  <nav><a href="/">Home</a><div class="nd"><button type="button" class="ndt" aria-haspopup="true" aria-expanded="false">Team</button><div class="menu"><ul><li><a href="/members/">Current</a></li><li><a href="/alumni/">Alumni</a></li></ul></div></div><a href="/news">News</a><a href="/research/">Research</a><a href="/publications/">Publications</a><a href="/projects">Projects</a><a href="/photo/" class="on">Photo</a></nav>
</div></header>
<main class="wrap">
  <div class="phead"><a class="back" href="/photo/">← All photos</a><h1>{{ page.heading }}</h1></div>
  {% assign pics = site.data[page.data] %}
  <div class="gal">{% for pic in pics %}<figure>{% if pic.info %}<figcaption>{{ pic.info }}</figcaption>{% endif %}<img src="/images/activity/{{ page.folder }}/{{ pic.image }}" alt="{{ pic.info }}" loading="lazy"></figure>{% endfor %}</div>
</main>
<footer><div class="wrap">© DSAIL, KAIST. Data Science &amp; Artificial Intelligence Lab.</div></footer>
<script>
(function(){var nd=document.querySelector('header.top nav .nd');if(!nd)return;
  var btn=nd.querySelector('.ndt');
  var set=function(open){nd.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false')};
  btn.addEventListener('click',function(e){e.stopPropagation();set(!nd.classList.contains('open'))});
  document.addEventListener('click',function(e){if(!nd.contains(e.target))set(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nd.classList.contains('open')){set(false);btn.focus()}});
})();
</script>
</body>
</html>
