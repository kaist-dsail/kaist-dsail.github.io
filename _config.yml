# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: DSAIL @ KAIST
email: cy.park@kaist.ac.kr
description: >
  Data Science & Artificial Intelligence Lab (DSAIL) at KAIST, led by
  Prof. Chanyoung Park. We study graph and relational learning, personalized
  recommendation, multimodal intelligence, agentic AI, and AI for science.
baseurl: ""
url: "https://dsail.kaist.ac.kr"

plugins:
  - jekyll-sitemap

include:
  - .htaccess
  - _pages

# repo housekeeping that must not become public pages
exclude:
  - DEPLOY_NOTES.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .DS_Store

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

